name: upload-fs33
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch, check and upload release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          curl -fsSL --retry 5 -o FastShare.apk 'https://tmpfiles.org/dl/1794015907.4b8a78dc38b29a2c/wgAs5Ef8muug/up_fastshare.apk'
          curl -fsSL --retry 5 -o FastShare_Windows_Setup.exe 'https://tmpfiles.org/dl/1794015909.0e78077be540f2fa/wsAJ5NftmbRd/up_windows_setup.exe'
          curl -fsSL --retry 5 -o FastShare_Windows_32bit_Setup.exe 'https://tmpfiles.org/dl/1794015911.d7860f0fafe543b5/wUAN5Afdm2F9/up_windows_32bit_setup.exe'
          curl -fsSL --retry 5 -o FastShare_Windows_Portable.zip 'https://tmpfiles.org/dl/1794015914.4e352ce87eb88d7d/wwAl5OfymeSu/up_windows_portable.zip'
          : > sums
          echo "9f191911908ee6ca0c3fe675f1237574c29ec7b5cc5d5fa554df5b88ea81772d  FastShare.apk" >> sums
          echo "a397daa0080883f91642a17be8a81e76b155ba524731980d44eadc08970fcb9f  FastShare_Windows_Setup.exe" >> sums
          echo "6a6d904d5877899f99566985cf9f126df57db7a1baf366ffdd2db7e3ad0f2e55  FastShare_Windows_32bit_Setup.exe" >> sums
          echo "32f4e24c3e0cf9f81377344cb80b6b4ce97910ce521d8b2d66b122f1600fb59c  FastShare_Windows_Portable.zip" >> sums
          sha256sum -c sums
          up() {
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: $2" \
              --data-binary @"$1" "https://uploads.github.com/repos/${{ github.repository }}/releases/437245111/assets?name=$1" > /dev/null
            echo "uploaded $1"
          }
          up FastShare.apk application/vnd.android.package-archive
          up FastShare_Windows_Setup.exe application/vnd.microsoft.portable-executable
          up FastShare_Windows_32bit_Setup.exe application/vnd.microsoft.portable-executable
          up FastShare_Windows_Portable.zip application/zip
