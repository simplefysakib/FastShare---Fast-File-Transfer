name: upload-fs30
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch, check and upload release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          curl -fsSL --retry 5 -o FastShare.apk 'https://tmpfiles.org/dl/1794013776.03ab024d05665ea6/wrAk5kf854o8/up_fastshare.apk'
          curl -fsSL --retry 5 -o FastShare_Windows_Setup.exe 'https://tmpfiles.org/dl/1794013778.75fefe140a12d378/w9A15xfu50WY/up_windows_setup.exe'
          curl -fsSL --retry 5 -o FastShare_Windows_32bit_Setup.exe 'https://tmpfiles.org/dl/1794013782.610f88f14787ca91/wBA85xfR5ntb/up_windows_32bit_setup.exe'
          curl -fsSL --retry 5 -o FastShare_Windows_Portable.zip 'https://tmpfiles.org/dl/1794013784.e6a637867e007e23/w8AR5Ff25KjY/up_windows_portable.zip'
          : > sums
          echo "3a60b8c6c9f55330eb35e123df895b3dc45ab3d8dcfe4e39822245d2ad4edb87  FastShare.apk" >> sums
          echo "a397daa0080883f91642a17be8a81e76b155ba524731980d44eadc08970fcb9f  FastShare_Windows_Setup.exe" >> sums
          echo "6a6d904d5877899f99566985cf9f126df57db7a1baf366ffdd2db7e3ad0f2e55  FastShare_Windows_32bit_Setup.exe" >> sums
          echo "32f4e24c3e0cf9f81377344cb80b6b4ce97910ce521d8b2d66b122f1600fb59c  FastShare_Windows_Portable.zip" >> sums
          sha256sum -c sums
          up() {
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: $2" \
              --data-binary @"$1" "https://uploads.github.com/repos/${{ github.repository }}/releases/437227975/assets?name=$1" > /dev/null
            echo "uploaded $1"
          }
          up FastShare.apk application/vnd.android.package-archive
          up FastShare_Windows_Setup.exe application/vnd.microsoft.portable-executable
          up FastShare_Windows_32bit_Setup.exe application/vnd.microsoft.portable-executable
          up FastShare_Windows_Portable.zip application/zip
