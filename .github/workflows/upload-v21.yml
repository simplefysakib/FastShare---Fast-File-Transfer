name: upload-v21
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch, check and upload release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          get() {
            dl=$(curl -fsSL --retry 3 "$1" | grep -o 'https://tmpfiles.org/dl/[^"]*' | head -1)
            curl -fsSL --retry 3 -o "$2" "$dl"
          }
          get https://tmpfiles.org/w8A8ofyeJKNg/fastshare.apk FastShare.apk
          get https://tmpfiles.org/woAHoUyUJZ81/fastshare_windows_setup.exe FastShare_Windows_Setup.exe
          get https://tmpfiles.org/wiAIo6yu5tw1/fastshare_windows_32bit_setup.exe FastShare_Windows_32bit_Setup.exe
          get https://tmpfiles.org/wEAOolyO5SfW/fastshare_windows_portable.zip FastShare_Windows_Portable.zip
          : > sums
          echo "b743cce905475cb35419d9adea106b46b0ab6797ac24e354887386a39c552b08  FastShare.apk" >> sums
          echo "ffb007270f53af674b078c32ce17db214fe3d5692165c887f387834d4b3f4678  FastShare_Windows_Setup.exe" >> sums
          echo "b2fb02d59b0bd49424160d2bd2641954eed8e70ff00c55c2fd18f71ea985d6b3  FastShare_Windows_32bit_Setup.exe" >> sums
          echo "86a132f7867b501d4eb14c5c3444fe7cf9af6b25bf76a81ef838f4249832f576  FastShare_Windows_Portable.zip" >> sums
          sha256sum -c sums
          up() {
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: $2" \
              --data-binary @"$1" "https://uploads.github.com/repos/${{ github.repository }}/releases/433000717/assets?name=$1" > /dev/null
            echo "uploaded $1"
          }
          up FastShare.apk application/vnd.android.package-archive
          up FastShare_Windows_Setup.exe application/vnd.microsoft.portable-executable
          up FastShare_Windows_32bit_Setup.exe application/vnd.microsoft.portable-executable
          up FastShare_Windows_Portable.zip application/zip
